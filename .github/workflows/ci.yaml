name: CI

# Tests the hs_vision crate, its musl build (built, checked and loaded in Home Assistant by native/build.sh), the licence
# texts and the pins in nodes/Vision.cs, then the C# node libraries and hass_sharp.toml against a pinned hass-sharp
# commit. release.yaml runs this workflow first and publishes only if it passes. Binaries are published only by
# release.yaml, as release assets, and never committed: the library this workflow builds is thrown away with the runner.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # The hass-sharp commit the C# tests build against: a 40-hex sha, never a branch, so that a hass-sharp change cannot
  # break this repository's CI without a commit here (Ruling 25). It pins a commit with the APIs these files need
  # ([NodeSetup], NodeSetupContext, DrawCircle, the timestamp sensor fix and the fake ffmpeg's still picture) and what
  # Add external imports hass_sharp.toml with (the node library import operation and external.py), now on hass-sharp's
  # branch face-detection-and-external-import; once HassSharp releases them it moves to the commit of that release's
  # tag. none turns the C# tests off, and the csharp job then only says so; any other value fails the job.
  HASS_SHARP_REF: d43fe35db845d7502b5ae669e9554a05ccc1af95

jobs:
  native:
    name: Native library (cargo test, musl build, pins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Rust toolchain
        # The toolchain native/rust-toolchain.toml names. rustup 1.28 and later install it only when asked.
        working-directory: native
        run: |
          rustup toolchain install
          rustup show
      - name: Face recognition model
        # SFace, which the recogniser tests open from native/model/: downloaded and checked by its pinned SHA-256, never
        # committed.
        run: ./native/fetch-model.sh
      - name: Crate tests
        working-directory: native
        run: cargo test --release --locked
      - name: musl build
        # Docker on the runner, native x64: the build in rust:alpine, its NEEDED check and a load in Home Assistant's image.
        run: ./native/build.sh linux-musl-x64
      - name: Licence texts are current
        run: |
          ./native/build.sh --licenses
          git diff --exit-code -- native/THIRD-PARTY-LICENSES
      - name: Pins
        # With HS_VISION_CHECK_RELEASE=1 the release's SHA256SUMS is compared with native/SHA256SUMS too, once released.
        env:
          HS_VISION_CHECK_RELEASE: '1'
        run: python -m unittest discover -s tests -v

  csharp:
    name: C# node libraries (against hass-sharp)
    runs-on: ubuntu-latest
    steps:
      - name: HASS_SHARP_REF is a commit or none
        # A branch or tag name would let a hass-sharp change break this CI without a commit here, so only a full sha is taken.
        run: |
          if [ "$HASS_SHARP_REF" = none ]; then
            echo "::notice::The C# tests are off: HASS_SHARP_REF is none"
          elif [[ $HASS_SHARP_REF =~ ^[0-9a-f]{40}$ ]]; then
            echo "The C# tests build against hass-sharp commit $HASS_SHARP_REF"
          else
            echo "::error::HASS_SHARP_REF is '$HASS_SHARP_REF', but it must be none or a full 40-character lowercase hex commit sha, never a branch or tag name"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: env.HASS_SHARP_REF != 'none'
      - uses: actions/checkout@v4
        if: env.HASS_SHARP_REF != 'none'
        with:
          repository: dompagoj/hass-sharp
          ref: ${{ env.HASS_SHARP_REF }}
          path: .hass-sharp
      - uses: actions/setup-dotnet@v4
        if: env.HASS_SHARP_REF != 'none'
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-python@v5
        # The fake ffmpeg of hass-sharp's runtime suite is a Python script, and the manifest test runs in Python.
        if: env.HASS_SHARP_REF != 'none'
        with:
          python-version: '3.14'
      - name: Install libjpeg-turbo
        # hass-sharp's picture code decodes and encodes with the system's libturbojpeg, as Home Assistant's image has it.
        # The package is libturbojpeg0 on Debian and current Ubuntu, libturbojpeg on Ubuntu 24.04 and earlier.
        if: env.HASS_SHARP_REF != 'none'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libturbojpeg0 || sudo apt-get install -y --no-install-recommends libturbojpeg
      - name: Build the library
        # The host build, native/target/release/libhs_vision.so, which the tests load for linux-x64.
        if: env.HASS_SHARP_REF != 'none'
        working-directory: native
        run: |
          rustup toolchain install
          rustup show
          cargo build --release --locked --lib
      - name: Face recognition model
        # SFace, which the recogniser tests serve from native/model/: downloaded and checked by its pinned SHA-256, never
        # committed.
        if: env.HASS_SHARP_REF != 'none'
        run: ./native/fetch-model.sh
      - name: C# tests
        # With HS_VISION_REQUIRE_LIBRARY=1 a missing library or model fails the tests that need it instead of skipping them.
        if: env.HASS_SHARP_REF != 'none'
        env:
          HS_VISION_REQUIRE_LIBRARY: '1'
        run: >-
          dotnet run --project tests/Vision.Tests --disable-build-servers
          -p:HassSharpRoot=${{ github.workspace }}/.hass-sharp -- --vision --people-detector --vision-manifest
      - name: Manifest
        # hass_sharp.toml and the files it lists, read by hass-sharp's external.py, as Add external reads them.
        if: env.HASS_SHARP_REF != 'none'
        env:
          HASS_SHARP_ROOT: ${{ github.workspace }}/.hass-sharp
        run: python -m unittest discover -s tests -v
